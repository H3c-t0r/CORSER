
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS-ER</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            height: 100vh;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        /* Left Section: Request Form */
        .request-section {
            width: 40%;
            padding: 40px;
            background: #2a2a2a;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        label {
            font-size: 1.2rem;
            color: #ddd;
            margin-bottom: 8px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            margin-bottom: 15px;
            border: 2px solid #444;
            border-radius: 8px;
            background: #333;
            color: white;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #00aaff;
            outline: none;
        }

        textarea {
            height: 150px;
            resize: none;
        }

        .checkbox-container {
            margin: 20px 0;
        }

        .checkbox-container input {
            margin-right: 10px;
        }

        button {
            width: 100%;
            padding: 16px;
            font-size: 1.2rem;
            background: #00aaff;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0088cc;
        }

        /* Right Section: Response */
        .response-section {
            width: 60%;
            padding: 25px;
            background: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column;
        }

        .response-section h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        #responseDisplay {
            padding: 20px;
            background: #fafafa;
            border-radius: 10px;
            min-height: 300px;
            height: auto;
            font-family: "Courier New", Courier, monospace;
            font-size: 1rem;
            color: #444;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            word-wrap: break-word;
            margin-top: 15px;
            word-break: break-word;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
        }

        footer a {
            color: #00aaff;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .request-section, .response-section {
                width: 100%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Left Section: Request Form -->
    <div class="request-section">
        <h1>CORS Tester</h1>

        <!-- Input for URL -->
        <label for="urlInput">Request URL:</label>
        <input type="text" id="urlInput" placeholder="Enter the URL to test" value="https://example.com">

        <!-- Input for HTTP Method -->
        <label for="methodInput">HTTP Method:</label>
        <input type="text" id="methodInput" value="POST" placeholder="Enter HTTP method (e.g., POST, PUT)">

        <!-- Textarea for POST data -->
        <label for="postDataInput">POST Data (JSON format):</label>
        <textarea id="postDataInput" placeholder='{"key":"value"}'></textarea>

        <!-- Checkbox for credentials -->
        <div class="checkbox-container">
            <label for="withCredentialsCheckbox">
                <input type="checkbox" id="withCredentialsCheckbox"> Include Credentials (cookies)
            </label>
        </div>

        <!-- Button to send request -->
        <button onclick="sendCustomRequest()">Send Request</button>
    </div>

    <!-- Right Section: Response -->
    <div class="response-section">
        <div id="responseDisplay">Waiting for response...</div>
    </div>

    <script>
        async function sendCustomRequest() {
            const url = document.getElementById('urlInput').value;
            const method = document.getElementById('methodInput').value.toUpperCase();
            const postData = document.getElementById('postDataInput').value;
            const withCredentials = document.getElementById('withCredentialsCheckbox').checked;
            const responseDisplay = document.getElementById('responseDisplay');

            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: withCredentials ? 'include' : 'same-origin',
            };

            if (['POST', 'PUT', 'PATCH'].includes(method)) {
                try {
                    options.body = JSON.stringify(JSON.parse(postData));
                } catch (error) {
                    responseDisplay.textContent = `Invalid JSON format: ${error.message}`;
                    return;
                }
            }

            try {
                const response = await fetch(url, options);
                const responseText = await response.text();

                const headers = [...response.headers.entries()]
                    .map(([key, value]) => `${key}: ${value}`)
                    .join('\n');

                const formattedResponse = `
Status: ${response.status} ${response.statusText}

Headers:
${headers}

Body:
${responseText}
                `;

                responseDisplay.textContent = formattedResponse.trim();
            } catch (error) {
                responseDisplay.textContent = `Request failed: ${error.message}`;
            }
        }
    </script>
</body>
</html>
